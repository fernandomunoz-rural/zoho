<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRM Sandbox Mockup</title>
<style>
:root{--bg:#f2f4f7;--panel:#fff;--panel2:#f7f8fa;--card:#fff;--border:#e1e4ea;--text:#1d2129;--muted:#6b7280;--accent:#2f6fed;--primary:#6c4ad0;--primaryH:#5b3cc0;--hover:#eef2fb;--top:#1f2433;--topText:#e8eaf0;--side:#fff;--chip:#eef0f4;--danger:#e5484d;--ok:#16a34a;--warn:#d97706;--shadow:0 8px 28px rgba(0,0,0,.14);--sel:#e8efff;--grid:#d9dde4}
[data-theme=dark]{--bg:#121417;--panel:#1b1e23;--panel2:#202329;--card:#24272d;--border:#33373f;--text:#e6e8eb;--muted:#9aa1ab;--accent:#5b9bff;--hover:#2a2e36;--top:#0d0f12;--topText:#e6e8eb;--side:#16191d;--chip:#2c3038;--shadow:0 8px 28px rgba(0,0,0,.55);--sel:#24324d;--grid:#3a3f48}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:6px 8px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
textarea{min-height:70px;width:100%;resize:vertical}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-rows:50px 1fr;height:100vh}
/* top bar */
.top{background:var(--top);color:var(--topText);display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid #000}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.2px;min-width:200px}
.logo .sq{display:grid;grid-template-columns:repeat(2,9px);gap:2px}
.logo .sq i{width:9px;height:9px;border-radius:2px;display:block}
.org{font-weight:400;opacity:.7;font-size:12px}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;background:#262a33;border-color:#383d48;color:#e8eaf0;padding:7px 10px 7px 32px;border-radius:8px}
[data-theme=light] .search input{background:#2b3142}
.search .si{position:absolute;left:10px;top:9px;color:#9aa1ab}
.sres{position:absolute;top:38px;left:0;right:0;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);max-height:420px;overflow:auto;z-index:50}
.sres .grp{padding:6px 12px;font-size:11px;text-transform:uppercase;color:var(--muted);background:var(--panel2)}
.sres a{display:block;padding:7px 12px;color:var(--text)}
.sres a:hover{background:var(--hover);text-decoration:none}
.tbtn{background:transparent;border:0;color:var(--topText);height:32px;min-width:32px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;position:relative;padding:0 8px}
.tbtn:hover{background:#ffffff1a}
.dot{position:absolute;top:3px;right:3px;background:#e5484d;color:#fff;border-radius:9px;font-size:10px;padding:0 4px;line-height:15px}
.rolesel{background:#262a33;color:#e8eaf0;border:1px solid #383d48;border-radius:8px;padding:5px 8px}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12px;color:#fff;flex:none}
.body{display:grid;grid-template-columns:210px 1fr;min-height:0}
.side{background:var(--side);border-right:1px solid var(--border);overflow:auto;padding:10px 8px}
.side .sec{font-size:11px;text-transform:uppercase;color:var(--muted);margin:14px 10px 6px;letter-spacing:.4px}
.side a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;color:var(--text);margin-bottom:1px}
.side a:hover{background:var(--hover);text-decoration:none}
.side a.on{background:var(--sel);color:var(--accent);font-weight:600}
.side a .cnt{margin-left:auto;font-size:11px;color:var(--muted)}
.main{overflow:auto;min-width:0}
.foot{color:var(--muted);font-size:11px;padding:16px 20px 30px;text-align:center}
/* generic */
.btn{border:1px solid var(--border);background:var(--panel);border-radius:6px;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pr{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.pr:hover{background:var(--primaryH)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.dg{color:var(--danger)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--chip);border-radius:10px;padding:1px 8px;font-size:11.5px;margin:1px 3px 1px 0;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:1px 7px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b-both{background:#7c5cff26;color:#a78bfa}.b-alum{background:#10b98126;color:#34d399}.b-emp{background:#3b82f626;color:#60a5fa}.b-none{background:#9ca3af26;color:#9ca3af}
.b-t1{background:#f59e0b26;color:#f5a524}.b-t2{background:#3b82f626;color:#60a5fa}.b-t3{background:#9ca3af26;color:#9ca3af}
.b-ok{background:#16a34a26;color:#22c55e}.b-warn{background:#d9770626;color:#f59e0b}.b-bad{background:#e5484d26;color:#f87171}.b-info{background:#3b82f626;color:#60a5fa}
[data-theme=light] .b-alum{color:#047857}[data-theme=light] .b-both{color:#6d28d9}[data-theme=light] .b-emp{color:#1d4ed8}[data-theme=light] .b-t1{color:#b45309}[data-theme=light] .b-t2{color:#1d4ed8}[data-theme=light] .b-ok{color:#15803d}[data-theme=light] .b-warn{color:#b45309}[data-theme=light] .b-bad{color:#b91c1c}[data-theme=light] .b-info{color:#1d4ed8}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px}
.card h3{margin:0;font-size:14px;padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.card .cb{padding:14px 16px}
.pagehead{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.pagehead h1{font-size:17px;margin:0;font-weight:600}
.sp{flex:1}
details.dd{position:relative;display:inline-block}
details.dd>summary{list-style:none;cursor:pointer}
details.dd>summary::-webkit-details-marker{display:none}
.menu{position:absolute;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);min-width:210px;padding:5px;z-index:40}
.menu.l{left:0;right:auto}
.menu a,.menu .mi{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:6px;color:var(--text);cursor:pointer}
.menu a:hover,.menu .mi:hover{background:var(--hover);text-decoration:none}
.menu .hd{font-size:11px;color:var(--muted);padding:8px 10px 3px;text-transform:uppercase}
.menu .mi.dis{opacity:.45}
/* list */
.listwrap{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 110px)}
.fpanel{border-right:1px solid var(--border);background:var(--panel);padding:12px;overflow:auto}
.fpanel h4{margin:4px 0 10px;font-size:13px}
.fpanel .fl{padding:5px 0}
.fpanel label{display:flex;gap:8px;align-items:center;cursor:pointer}
.fpanel .fctl{margin:5px 0 4px 24px}
.fpanel .fctl input,.fpanel .fctl select{width:100%}
.fpanel .grp{font-size:11px;color:var(--muted);text-transform:uppercase;margin:14px 0 4px}
.tablebar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tw{overflow:auto}
table.t{border-collapse:collapse;width:100%;min-width:900px}
table.t th{position:sticky;top:0;background:var(--panel2);text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
table.t td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top}
table.t tr:hover td{background:var(--hover)}
table.t tr.sel td{background:var(--sel)}
table.t.compact{min-width:0}
table.t.compact td,table.t.compact th{padding:7px 10px}
.empty{padding:40px;text-align:center;color:var(--muted)}
.kanban{display:flex;gap:12px;padding:14px;overflow:auto;align-items:flex-start}
.kcol{background:var(--panel2);border:1px solid var(--border);border-radius:10px;min-width:260px;width:260px}
.kcol h4{margin:0;padding:10px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;font-size:13px}
.kcard{background:var(--card);border:1px solid var(--border);border-radius:8px;margin:8px;padding:9px 10px;cursor:pointer}
.kcard:hover{border-color:var(--accent)}
/* detail */
.dwrap{display:grid;grid-template-columns:200px 1fr;min-height:calc(100vh - 50px)}
.rnav{border-right:1px solid var(--border);background:var(--panel);padding:12px 8px;position:sticky;top:0;align-self:start;max-height:calc(100vh - 50px);overflow:auto}
.rnav .hd{font-size:11px;color:var(--muted);text-transform:uppercase;padding:4px 10px 6px}
.rnav a{display:flex;justify-content:space-between;padding:6px 10px;border-radius:6px;color:var(--text)}
.rnav a:hover{background:var(--hover);text-decoration:none}
.dhead{display:flex;align-items:center;gap:14px;padding:16px 22px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
.dhead .big{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:19px;font-weight:600;color:#fff}
.dhead h1{margin:0;font-size:19px}
.tabs{display:flex;gap:4px;padding:0 22px;background:var(--panel);border-bottom:1px solid var(--border)}
.tabs a{padding:10px 12px;color:var(--muted);border-bottom:2px solid transparent}
.tabs a.on{color:var(--text);border-color:var(--primary);font-weight:600}
.tabs a:hover{text-decoration:none;color:var(--text)}
.dbody{padding:18px 22px;display:flex;flex-direction:column;gap:16px;max-width:1250px}
.secgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 40px}
.frow{display:grid;grid-template-columns:170px 1fr;gap:10px;padding:7px 0;border-bottom:1px dashed var(--border);align-items:start;min-height:34px}
.frow .fl{color:var(--muted)}
.frow .fv{position:relative;word-break:break-word;min-height:20px;border-radius:4px;padding:1px 4px;margin:-1px -4px}
.frow .fv.ed:hover{background:var(--hover);cursor:text}
.frow .fv.ed:hover::after{content:none}
.lock{color:var(--muted);font-size:11px;margin-left:6px}
.edbox{display:flex;flex-direction:column;gap:6px}
.edbox .row{display:flex;gap:6px}
.multi{display:flex;flex-wrap:wrap;gap:4px 10px}
.multi label{display:flex;gap:4px;align-items:center}
.secnote{font-size:12px;color:var(--muted);padding:10px 12px;background:var(--panel2);border-radius:8px;border:1px dashed var(--border)}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--border)}
.tli{position:relative;padding:4px 0 14px}
.tli:before{content:"";position:absolute;left:-19px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--primary);border:2px solid var(--card)}
.note{border:1px solid var(--border);border-radius:8px;padding:9px 11px;margin-bottom:8px;background:var(--panel2)}
/* home */
.grid{display:grid;gap:14px;padding:18px 20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer}
.kpi:hover{border-color:var(--accent)}
.kpi .v{font-size:26px;font-weight:700;margin-top:4px}
.kpi .l{color:var(--muted);font-size:12px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.bar{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;margin:7px 0}
.bar .tr{background:var(--chip);border-radius:4px;height:16px;overflow:hidden}
.bar .fi{height:100%;border-radius:4px}
.legend{display:flex;flex-direction:column;gap:6px}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
/* import */
.steps{display:flex;gap:0;padding:14px 20px;overflow:auto}
.step{flex:1;min-width:120px;text-align:center;position:relative;font-size:12px;color:var(--muted)}
.step b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;margin:0 auto 6px;background:var(--chip);color:var(--text)}
.step.done b{background:var(--ok);color:#fff}
.step:not(:last-child):after{content:"";position:absolute;top:14px;left:calc(50% + 18px);right:calc(-50% + 18px);height:2px;background:var(--border)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--border)}
.pair>div{padding:12px 16px}
.pair>div+div{border-left:1px solid var(--border)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:3px 10px;font-size:12.5px}
.kv span:nth-child(odd){color:var(--muted)}
.hit{background:#16a34a2e;border-radius:3px;padding:0 3px}
.scorebar{height:8px;background:var(--chip);border-radius:4px;overflow:hidden;width:160px;display:inline-block;vertical-align:middle}
.scorebar i{display:block;height:100%}
.mt td.pick{cursor:pointer}
.mt td.pick.on{background:#16a34a22;outline:1px solid #16a34a66}
/* modal */
.ov{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:100;padding:20px}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);width:min(860px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column}
.modal.wide{width:min(1100px,100%)}
.modal .mh{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.modal .mh h2{margin:0;font-size:16px;flex:1}
.modal .mb{padding:16px 18px;overflow:auto}
.modal .mf{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.form h4{margin:14px 0 8px;font-size:13px;border-bottom:1px solid var(--border);padding-bottom:6px}
.form h4:first-child{margin-top:0}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px}
.fgrid .ff{display:grid;grid-template-columns:150px 1fr;gap:8px;align-items:center}
.fgrid .ff.full{grid-column:1/-1}
.fgrid .ff input,.fgrid .ff select{width:100%}
.fgrid .ff input[type=checkbox],.multi input,.fpanel input[type=checkbox],table.t input[type=checkbox]{width:auto;padding:0;margin:0}
td.nw{white-space:nowrap}
.req{color:var(--danger)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 16px;border-radius:8px;box-shadow:var(--shadow);z-index:200;max-width:90vw}
.alert{padding:10px 12px;border-radius:8px;border:1px solid;font-size:12.5px}
.alert.w{border-color:#d9770666;background:#d977061a}
.alert.e{border-color:#e5484d66;background:#e5484d1a}
.alert.i{border-color:#3b82f666;background:#3b82f61a}
/* setup */
.setwrap{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 50px)}
.canvas{position:relative;background-color:var(--bg);background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:16px 16px;overflow:auto;height:calc(100vh - 160px);border-top:1px solid var(--border)}
.canvas .inner{position:relative;width:1640px;height:1060px}
.mbox{position:absolute;width:300px;border-radius:10px;border:1px solid #4d8f5a;background:#2b4433;box-shadow:0 2px 8px #0005;color:#e6e8eb}
.mbox.std{border-color:#5b8fb4;background:#2e4553}
.mbox h5{margin:0;padding:9px;text-align:center;font-size:13.5px;border-top:4px solid #8fd19e;border-radius:10px 10px 0 0}
.mbox.std h5{border-top-color:#7cc4f0}
.mbox .mf2{display:grid;grid-template-columns:1fr 110px;gap:6px;background:#1c1e22;margin:5px 8px;padding:7px 9px;border-radius:5px;font-size:12px}
.mbox .more{text-align:center;font-size:11px;color:#9aa1ab;padding:2px 0 8px}
.canvas svg.links{position:absolute;inset:0;pointer-events:none;width:1640px;height:1060px}
.canvas svg.links path{fill:none;stroke:#c9ccd2;stroke-width:1.6;opacity:.75}
.canvas svg.links path.hl{stroke:#3b8cff;stroke-width:2.4;opacity:1}
[data-theme=light] .canvas svg.links path{stroke:#8b93a1}
.perm td{text-align:center}.perm td:first-child{text-align:left}
.pass{color:#22c55e;font-weight:700}.fail{color:#f87171;font-weight:700}
/* v2 additions */
.vsearch{width:100%;margin:2px 0 6px}
.vitem .star{margin-left:8px;opacity:.3;display:inline-flex}
.vitem .star:hover{opacity:.8}
.vitem .star.on{opacity:1;color:#f5a524}
.vitem .star.on svg{fill:currentColor}
.drop{border:2px dashed var(--border);border-radius:12px;padding:40px 20px;text-align:center;cursor:pointer;display:block;background:var(--panel2);transition:border-color .15s}
.drop:hover,.drop.over{border-color:var(--accent)}
.wsteps{display:flex;gap:6px;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--panel);flex-wrap:wrap;align-items:center}
.wsteps span{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:16px;background:var(--chip);color:var(--muted);font-size:12px}
.wsteps span.on{background:var(--primary);color:#fff}
.wsteps span.done{background:#16a34a26;color:#22c55e}
.cvrow{display:grid;grid-template-columns:24px 1.3fr 1fr 1.3fr 34px;gap:8px;align-items:center;margin-bottom:8px}
.cvrow select,.cvrow input{width:100%}
.imgph{width:64px;height:64px;border-radius:10px;background:var(--chip);display:grid;place-items:center;color:var(--muted);margin-bottom:14px;border:1px dashed var(--border)}
.split{display:inline-flex}.split>.btn.pr{border-radius:6px 0 0 6px}.split summary.btn{border-radius:0 6px 6px 0;border-left:1px solid #ffffff40;padding:6px 8px}
.ico-s svg.i{width:13px;height:13px}
.lock{display:inline-flex;vertical-align:-2px}.lock svg.i{width:13px;height:13px}
.help{display:inline-flex;vertical-align:-2px;color:var(--muted);cursor:help}.help svg.i{width:13px;height:13px}
.frow .fv.ed:hover::after{content:none}
.frow .fv.ed:hover{box-shadow:inset 0 0 0 1px var(--border)}
.pass,.fail{display:inline-flex;align-items:center;gap:4px}
.radio-list{display:flex;flex-direction:column;gap:10px}
.radio-list label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.radio-list input{margin-top:3px}
.sub{font-size:12px;color:var(--muted)}
.card h3 .sp{flex:1}
@media (max-width:900px){
 .body{grid-template-columns:1fr}.side{display:none}.side.open{display:block;position:fixed;top:50px;bottom:0;left:0;width:240px;z-index:60;box-shadow:var(--shadow)}
 .listwrap,.dwrap,.setwrap{grid-template-columns:minmax(0,1fr)}.body{grid-template-columns:minmax(0,1fr)}.dhead>div{min-width:0;flex:1 1 200px}.dhead .chip,.dhead .badge{white-space:normal}.dhead h1{font-size:17px}.fpanel,.rnav{display:none}
 .cols2,.cols3,.secgrid,.fgrid{grid-template-columns:1fr}.logo{min-width:0}.org,.hidem{display:none}
 .pair{grid-template-columns:1fr}.pair>div+div{border-left:0;border-top:1px solid var(--border)}
}
@media (min-width:901px){.mtoggle{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ============================================================
   CRM SANDBOX MOCKUP — Zoho CRM–style UI with case-study data
   (Ensign College alumni / employer-relations unification)
   ============================================================ */
const STORE='crm-mockup-ensign-v1';
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lc=s=>String(s??'').trim().toLowerCase();

const W={ensign:40,other:30,phone:25,pemail:20,semail:20,name:10};
const AUTO_T=50,REVIEW_T=20;
function phoneKey(p){let d=String(p||'').replace(/\D/g,'');if(d.length===11&&d[0]==='1')d=d.slice(1);return d}
function fmtPhone(p){const d=phoneKey(p);return d.length===10?`${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}`:p}
function nameCompat(a,b){const fa=[a.first,a.pref].filter(Boolean).map(lc),fb=[b.first,b.pref].filter(Boolean).map(lc);const la=[a.last,a.former].filter(Boolean).map(lc),lb=[b.last,b.former].filter(Boolean).map(lc);return fa.some(x=>fb.includes(x))&&la.some(x=>lb.includes(x))}
function emailSuspect(r){if(!r.pemail)return false;const local=lc(r.pemail).split('@')[0];return !!r.last&&!local.includes(lc(r.last))&&!(r.former&&local.includes(lc(r.former)))&&!local.includes(lc(r.first).slice(0,1)+lc(r.last))}
function scorePair(a,b){const ev=[];
 if(a.ensignId&&a.ensignId===b.ensignId)ev.push({k:'ensign',l:'Ensign Student ID',p:W.ensign,strong:1,v:a.ensignId});
 if(a.otherId&&a.otherId===b.otherId)ev.push({k:'other',l:'Other-institution ID',p:W.other,strong:1,v:a.otherId});
 if(phoneKey(a.phone)&&phoneKey(a.phone)===phoneKey(b.phone))ev.push({k:'phone',l:'Phone (normalized)',p:W.phone,strong:1,v:fmtPhone(a.phone)});
 if(a.pemail&&lc(a.pemail)===lc(b.pemail))ev.push({k:'pemail',l:'Personal email',p:W.pemail,strong:1,v:lc(a.pemail)});
 if(a.semail&&lc(a.semail)===lc(b.semail))ev.push({k:'semail',l:'School email',p:W.semail,strong:1,v:lc(a.semail)});
 if(nameCompat(a,b))ev.push({k:'name',l:'Name compatible',p:W.name,strong:0,v:`${a.first} ${a.last} ~ ${b.first} ${b.last}`});
 const score=ev.reduce((s,e)=>s+e.p,0),strong=ev.filter(e=>e.strong).length;
 let route=null;if(strong>=2&&score>=AUTO_T)route='suggested';else if(strong===1||score>=REVIEW_T)route='review';else if(ev.length)route='nameonly';
 return{score,strong,ev,route}}
function computePairs(rows){const out=[];for(let i=0;i<rows.length;i++)for(let j=i+1;j<rows.length;j++){const s=scorePair(rows[i],rows[j]);if(s.ev.length)out.push({key:rows[i].id+'+'+rows[j].id,a:rows[i],b:rows[j],...s})}return out.sort((x,y)=>y.score-x.score)}

const MERGE_FIELDS=[['first','First Name','identity'],['pref','Preferred Name','identity'],['last','Last Name','identity'],['former','Former Last Name','identity'],['pemail','Personal Email','email'],['semail','School Email','identity'],['phone','Phone','phone'],['ensignId','Ensign Student ID','identity'],['otherInst','Other Institution','inst'],['otherId','Other Student ID','identity'],['year','Ensign Graduation Year','identity'],['program','Ensign Program','identity'],['employer','Current Employer','recent'],['title','Current Job Title','recent'],['empContact','Employer Contact','authER'],['alumni','Alumni','evidence']];
function mergeDefaults(a,b){
 const newer=a.updated>=b.updated?'a':'b',rank=(SRC_RANK[a.sys]||0)-(SRC_RANK[b.sys]||0);
 return MERGE_FIELDS.map(([k,l,rule])=>{let va=a[k],vb=b[k],pick,why,alt='';
  if(rule==='inst'){va=stdInst(va);vb=stdInst(vb)}
  if(rule==='phone'){va=va&&fmtPhone(va);vb=vb&&fmtPhone(vb)}
  if(!va&&!vb){pick='a';why='Both blank'}
  else if(!va||!vb){pick=va?'a':'b';why='Blank never replaces data'}
  else if(lc(va)===lc(vb)){pick='a';why=rule==='inst'||rule==='phone'?'Agree after standardizing':'Values agree'}
  else if(rule==='email'){const sa=emailSuspect(a),sb=emailSuspect(b);if(sa!==sb){pick=sa?'b':'a';alt=sa?va:vb;why='Likely typo kept as alternate'}else{pick=rank>=0?'a':'b';why='Verified source wins'}}
  else if(rule==='recent'){pick=newer;why='Most recent value wins'}
  else if(rule==='authER'){const er=a.sys==='Employer Relations CRM'||b.sys==='Employer Relations CRM';pick=a.sys==='Employer Relations CRM'?'a':b.sys==='Employer Relations CRM'?'b':va==='Yes'?'a':vb==='Yes'?'b':newer;why=er?'Employer Relations is authoritative for this flag':'A confirmed role is kept unless Employer Relations removes it'}
  else if(rule==='evidence'){const ev=(a.ensignId&&a.year)||(b.ensignId&&b.year);pick=ev?(va==='Yes'?'a':'b'):newer;why='Evidence-based: Ensign ID + graduation year'}
  else{pick=rank>0?'a':rank<0?'b':newer;why=rank?'Verified source wins':'Same source rank → most recent'}
  return{k,l,va,vb,pick,why,alt}})}

function donut(data,size=150){const tot=data.reduce((s,d)=>s+d.v,0)||1;let off=0;const R=54,C=2*Math.PI*R;
 const segs=data.map(d=>{const len=d.v/tot*C;const s=`<circle r="${R}" cx="75" cy="75" fill="none" stroke="${d.c}" stroke-width="22" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"><title>${esc(d.l)}: ${d.v}</title></circle>`;off+=len;return s}).join('');
 return`<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><svg width="${size}" height="${size}" viewBox="0 0 150 150">${segs}<text x="75" y="72" text-anchor="middle" font-size="24" font-weight="700" fill="currentColor">${tot}</text><text x="75" y="92" text-anchor="middle" font-size="11" fill="currentColor" opacity=".6">total</text></svg><div class="legend">${data.map(d=>`<span><i style="background:${d.c}"></i>${esc(d.l)} <b>${d.v}</b></span>`).join('')}</div></div>`}
function bars(data,max){max=max||Math.max(1,...data.map(d=>d.v));return data.map(d=>`<div class="bar"><span title="${esc(d.l)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${d.href?`<a href="${d.href}">${esc(d.l)}</a>`:esc(d.l)}</span><div class="tr"><div class="fi" style="width:${d.v/max*100}%;background:${d.c||'var(--accent)'}"></div></div><b>${d.v}</b></div>`).join('')}

function sectionCard(m,r,s){const M=MOD[m];const fs=M.fields.filter(f=>f.s===s);const half=Math.ceil(fs.length/2);
 const ferpaHide=m==='contacts'&&s==='alum'&&r.ferpa&&role()==='er';
 const row=f=>{const ed=canEdit(f)&&!M.readonly;return`<div class="frow"><div class="fl">${esc(f.l)}${f.help?` <span title="${esc(f.help)}" class="help">${I('info')}</span>`:''}</div><div class="fv ${ed?'ed':''}" ${ed?`data-a="iedit" data-m="${m}" data-id="${r.id}" data-k="${f.k}"`:''}>${ferpaHide&&f.k!=='ferpa'?'<span class="muted">Hidden — FERPA privacy block</span>':disp(m,f.k,r)}${!ed&&!M.readonly?`<span class="lock" title="${f.p==='F'||f.t==='formula'?'Calculated / system field':'Editable by '+esc(PERM_LABEL[f.p])}">${I('lock')}</span>`:''}</div></div>`};
 return`<div class="card"><h3>${esc(M.sections[s])}${m==='contacts'&&s==='emp'?' <span class="muted" style="font-weight:400;font-size:12px">· owned by Employer Relations</span>':''}${m==='contacts'&&s==='alum'?' <span class="muted" style="font-weight:400;font-size:12px">· owned by Alumni Services</span>':''}</h3><div class="cb"><div class="secgrid"><div>${fs.slice(0,half).map(row).join('')}</div><div>${fs.slice(half).map(row).join('')}</div></div></div></div>`}
function miniTable(m,rows,cols,empty){return rows.length?`<div class="tw"><table class="t compact">${'<tr>'+cols.map(k=>`<th>${esc(k==='name'?'Name':(MOD[m].fmap[k]||{l:k}).l)}</th>`).join('')+'</tr>'}${rows.map(r=>`<tr>${cols.map((k,i)=>`<td>${i===0?`<a href="#/${m}/${r.id}">${esc(recName(m,r))}</a>`:disp(m,k,r)}</td>`).join('')}</tr>`).join('')}</table></div>`:`<div class="empty" style="padding:18px">${empty||'No records found'}</div>`}

 case'notes':{const ns=DB.notes.filter(n=>n.mod===m&&n.rid===id).sort((a,b)=>b.at.localeCompare(a.at));body=`<div style="display:flex;gap:8px;margin-bottom:10px"><input id="newnote" placeholder="Add a note…" style="flex:1"><button class="btn pr" data-a="addnote" data-m="${m}" data-id="${id}">Save</button></div>${ns.map(n=>`<div class="note">${esc(n.text)}<div class="muted" style="font-size:11.5px;margin-top:4px">${esc(USERS[n.by]?.name)} · ${fmtD(n.at)}</div></div>`).join('')||'<div class="muted">No notes yet.</div>'}`;break}
 case'edu':{const rows=DB.edu.filter(e=>e.contact===id).sort((a,b)=>a.inst==='Ensign College'?-1:1);act=`<button class="btn sm" data-a="new" data-m="edu" data-pre="contact=${id}" ${canEdit(MOD.edu.fmap.inst)?'':'disabled title="Only Alumni Services can add education records"'}>${I('plus')} New</button>`;body=(r.ferpa&&role()==='er')?'<div class="empty" style="padding:18px">Education details hidden — FERPA privacy block.</div>':miniTable('edu',rows,['title','inst','sid','year','status','dsrc','verifiedBy'])+`<div class="muted" style="font-size:12px;padding:8px 2px 0">One record per institution. Is Alumnus is derived from the Ensign College record with Status = Completed.</div>`;break}
 case'emp':{const rows=DB.emp.filter(e=>e[m==='accounts'?'account':'contact']===id).sort((a,b)=>(b.current-a.current));act=`<button class="btn sm" data-a="new" data-m="emp" data-pre="${m==='accounts'?'account':'contact'}=${id}">${I('plus')} New</button>`;body=miniTable('emp',rows,m==='accounts'?['title','contact','current','lastVerified','dsrc']:['title','account','current','end','lastVerified','dsrc']);break}
 case'tasks':{const ts=DB.tasks.filter(t=>t.rid===id&&t.status==='Open');act=`<button class="btn sm" data-a="newtask" data-m="${m}" data-id="${id}">${I('plus')} Task</button>`;body=ts.length?`<table class="t compact"><tr><th>Subject</th><th>Due</th><th>Priority</th><th>Owner</th><th></th></tr>${ts.map(t=>`<tr><td>${esc(t.subject)}</td><td>${fmtD(t.due)}</td><td>${esc(t.priority)}</td><td>${esc(USERS[t.owner].name)}</td><td><a class="btn sm" data-a="donetask" data-id="${t.id}">${I('check')} Close</a></td></tr>`).join('')}</table>`:'<div class="muted">No open activities.</div>';break}
 case'log':{const rows=DB.log.filter(l=>l.survivor===id||(r.sources||'').split(', ').some(s=>l.sources.includes(s)));body=miniTable('log',rows,['name','action','score','reviewer','at']);break}
 case'intern':{const rows=DB.intern.filter(i=>i[m==='accounts'?'account':'supervisor']===id);body=miniTable('intern',rows,['name','student','semester','paid']);act=m==='accounts'?`<button class="btn sm" data-a="new" data-m="intern" data-pre="account=${id}">${I('plus')} New</button>`:'';break}
 case'visits':{const rows=DB.visits.filter(i=>i[m==='accounts'?'account':'mainContact']===id);body=miniTable('visits',rows,['name','eventType','date','mainContact']);act=m==='accounts'?`<button class="btn sm" data-a="new" data-m="visits" data-pre="account=${id}">${I('plus')} New</button>`:'';break}
 case'projects':{body=miniTable('projects',DB.projects.filter(i=>i.account===id),['name','status','owner']);act=`<button class="btn sm" data-a="new" data-m="projects" data-pre="account=${id}">${I('plus')} New</button>`;break}
 case'src':{const rows=SOURCE.filter(s=>(r.sources||'').includes(s.id));body=`<div class="tw"><table class="t compact"><tr><th>Source ID</th><th>System</th><th>Name</th><th>Personal email</th><th>School email</th><th>Phone</th><th>Employer / Title</th><th>Updated</th><th>Note</th></tr>${rows.map(s=>`<tr><td><b>${s.id}</b></td><td>${esc(s.sys)}</td><td>${esc(s.first)} ${s.pref?`“${esc(s.pref)}” `:''}${esc(s.last)}</td><td>${esc(s.pemail)||'—'}</td><td>${esc(s.semail)||'—'}</td><td>${esc(s.phone)}</td><td>${esc([s.employer,s.title].filter(Boolean).join(' / '))||'—'}</td><td>${esc(s.updated)}</td><td>${esc(s.note)}</td></tr>`).join('')}</table></div><div class="muted" style="font-size:12px;padding-top:8px">Original staged rows are kept unchanged with their source system and original ID.</div>`;break}
 case'contacts':{const rows=DB.contacts.filter(c=>c.account===id);body=miniTable('contacts',rows,['name','ctype','title','pemail','phone']);act=`<button class="btn sm" data-a="new" data-m="contacts" data-pre="account=${id}">${I('plus')} New</button>`;break}
 case'alumni':{const ch=championOf(r);const rows=alumAt(id).sort((a,b)=>(b.isEmp-a.isEmp)||(b.id===ch)-(a.id===ch));
  body=`<div class="kpis" style="margin-bottom:12px"><div class="kpi"><div class="l">Alumni at this company</div><div class="v">${rows.length}</div></div><div class="kpi"><div class="l">Alumni who are employer contacts</div><div class="v">${rows.filter(c=>c.isEmp).length}</div></div><div class="kpi"><div class="l">Priority</div><div class="v" style="font-size:18px;margin-top:8px">${tierBadge(tierOf(r))}</div></div><div class="kpi"><div class="l">Alumni Champion</div><div class="v" style="font-size:15px;margin-top:8px">${ch?link('contacts',ch):'<span class="muted">—</span>'}</div></div></div>`+
  (rows.length?`<table class="t compact"><tr><th>Name</th><th>Labels</th><th>Title</th><th>Class</th><th>Program</th><th></th></tr>${rows.map(c=>`<tr><td>${link('contacts',c.id)}</td><td><span class="badge b-alum">Alumnus</span> ${c.isEmp?'<span class="badge b-both">Alumnus + Recruiting contact</span>':''} ${c.id===ch?`<span class="badge b-t1">${I('star','style="width:11px;height:11px"')} Champion</span>`:''}</td><td>${esc(c.title)}</td><td>${getVal('contacts',c,'gradYear')}</td><td>${esc(getVal('contacts',c,'program'))}</td><td>${c.id!==ch&&canEdit(MOD.accounts.fmap.champion)?`<a class="btn sm" data-a="champ" data-id="${id}" data-v="${c.id}">Make champion</a>`:''}</td></tr>`).join('')}</table>`:'<div class="empty" style="padding:18px">No known alumni at this company (Tier 3).</div>');break}}
 return`<div class="card" id="rl-${x.k}"><h3>${esc(x.l)} <span class="muted" style="font-weight:400">${x.n}</span><span class="sp"></span>${act}</h3><div class="cb">${body}</div></div>`}
function snapshotCard(r){const s=r.snapshot;if(!s)return'';return`<div class="card"><h3>${I('db')} Before-merge snapshot (enables reversal)</h3><div class="cb"><div class="tw"><table class="t compact"><tr><th>Field</th><th>${esc(s.a.id)} · ${esc(s.a.sys)} (${esc(s.a.updated)})</th><th>${esc(s.b.id)} · ${esc(s.b.sys)} (${esc(s.b.updated)})</th><th>Result</th><th>Rule applied</th></tr>${s.fields.map(f=>`<tr><td class="muted">${esc(f.l)}</td><td class="${f.pick==='a'&&f.va?'hit':''}">${esc(f.va)||'—'}</td><td class="${f.pick==='b'&&f.vb?'hit':''}">${esc(f.vb)||'—'}</td><td><b>${esc(f.pick==='a'?f.va:f.vb)||'—'}</b>${f.alt?`<div class="muted" style="font-size:11px">alt: ${esc(f.alt)}</div>`:''}</td><td><span class="chip">${esc(f.why)}</span></td></tr>`).join('')}</table></div></div></div>`}
function timeline(m,id){const ev=DB.timeline.filter(t=>t.mod===m&&t.rid===id).sort((a,b)=>b.at.localeCompare(a.at));return`<div class="card"><h3>History</h3><div class="cb"><div class="tl">${ev.map(t=>`<div class="tli"><div>${esc(t.text)}</div><div class="muted" style="font-size:12px">${esc(USERS[t.by]?.name||t.by)} · ${fmtD(t.at)}</div></div>`).join('')||'<div class="muted">No history yet.</div>'}</div></div></div>`}

function pageCaseTest(){const st=DB.staging;const pairs=st.ran?computePairs(SOURCE):[];const dec=st.decisions;
 const sug=pairs.filter(p=>p.route==='suggested'),rev=pairs.filter(p=>p.route!=='suggested');
 const pend=p=>!dec[p.key]||dec[p.key].status==='Deferred';const decided=pairs.filter(p=>dec[p.key]&&dec[p.key].status!=='Deferred');
 const steps=['Stage','Standardize','Score','Route','Approve','Merge rules','Audit'];const doneN=!st.ran?0:pairs.every(p=>!pend(p))?7:4;
 const tabs=[['staged','Staged Rows',SOURCE.length],['suggested','Suggested Merges',sug.filter(pend).length],['review','Review Queue',rev.filter(pend).length],['decided','Decided',decided.length]];
 const T=S.importTab;
 return`<div class="tablebar"><b>Case-study test batch</b><span class="muted">${esc(st.batch)} · row-to-row matching, mirrors the workbook</span><div class="sp"></div>${st.ran?`<button class="btn" data-a="resetimport">Reset batch</button>`:''}<button class="btn pr" data-a="runimport">${I('up')} ${st.ran?'Re-run':'Run'} test import (26 rows)</button></div>
 <div class="steps">${steps.map((s,i)=>`<div class="step ${i<doneN?'done':''}"><b>${i<doneN?I('check'):i+1}</b>${s}</div>`).join('')}</div>
 ${!st.ran?`<div class="grid"><div class="card"><div class="cb"><h2 style="margin-top:0">Imports never touch live Contacts directly</h2><p>Running the test import loads the 26 case-study rows into a <b>holding area</b>. Each row keeps its source system and original ID. The engine then standardizes phones, emails and school names, scores possible matches and routes them:</p>
 <table class="t compact" style="max-width:640px"><tr><th>Evidence</th><th>Points</th><th>Strength</th></tr>${[['Ensign Student ID',40,'Strong'],['Other-institution student ID',30,'Strong'],['Phone (normalized 10 digits)',25,'Strong'],['Personal email',20,'Strong'],['School email',20,'Strong'],['Name compatible (first/preferred + last/former)',10,'Weak']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table>
 <p class="muted">2+ strong matches (score ≥ ${AUTO_T}) → Suggested merge · 1 strong match → Review queue · Name or employer only → never merged, review queue only. A trained data steward approves, rejects or defers each suggestion and records a reason.</p><button class="btn pr" data-a="runimport">${I('up')} Run test import</button></div></div></div>`:
 `<div class="tabs" style="background:transparent">${tabs.map(([k,l,n])=>`<a class="${T===k?'on':''}" data-a="itab" data-v="${k}">${l} <span class="chip">${n}</span></a>`).join('')}</div>
 <div class="grid">${!canReview()?`<div class="alert w">You are viewing as <b>${ROLES[S.role].label}</b>. Only a trained Data Steward (or Administrator) can approve, reject or defer merges. Switch role in the top bar to try it.</div>`:''}
 ${T==='staged'?stagedTable():T==='decided'?decidedTable(decided):(T==='suggested'?sug:rev).map(p=>pairCard(p)).join('')||'<div class="empty">Nothing waiting here.</div>'}</div>`}`}
function stagedTable(){return`<div class="card"><h3>Holding area · normalized keys</h3><div class="tw"><table class="t compact"><tr><th>Row</th><th>Source system</th><th>Name</th><th>Phone (raw → key)</th><th>Personal email</th><th>School email</th><th>Ensign ID</th><th>Institution (raw → standard)</th><th>Email check</th><th>Updated</th></tr>${SOURCE.map(s=>`<tr><td><b>${s.id}</b></td><td>${esc(s.sys)}</td><td>${esc(s.first)} ${esc(s.last)}${s.former?` <span class="muted">(fmr ${esc(s.former)})</span>`:''}</td><td><span class="muted">${esc(s.phone)}</span> → <b>${phoneKey(s.phone)}</b></td><td>${esc(lc(s.pemail))||'—'}</td><td>${esc(lc(s.semail))||'—'}</td><td>${esc(s.ensignId)||'—'}</td><td>${s.otherInst?`<span class="muted">${esc(s.otherInst)}</span>${stdInst(s.otherInst)!==s.otherInst?` → <b>${esc(stdInst(s.otherInst))}</b>`:''}`:'—'}</td><td>${s.pemail?(emailSuspect(s)?'<span class="badge b-warn">Suspect: surname not in address</span>':'<span class="badge b-ok">OK</span>'):'—'}</td><td>${esc(s.updated)}</td></tr>`).join('')}</table></div></div>`}
function decidedTable(list){return`<div class="card"><div class="tw"><table class="t compact"><tr><th>Pair</th><th>Names</th><th>Score</th><th>Decision</th><th>Reviewer</th><th>When</th><th>Reason</th><th>Log</th></tr>${list.map(p=>{const d=DB.staging.decisions[p.key];return`<tr><td><b>${p.key.replace('+',' + ')}</b></td><td>${esc(p.a.first)} ${esc(p.a.last)} / ${esc(p.b.first)} ${esc(p.b.last)}</td><td>${p.score}</td><td>${disp('log','action',{action:d.status})}</td><td>${esc(USERS[d.by]?.name)}</td><td>${fmtD(d.at)}</td><td>${esc(d.reason)}</td><td>${d.log?`<a href="#/log/${d.log}">${d.log}</a>`:''}</td></tr>`}).join('')}</table></div></div>`}
function pairCard(p){const d=DB.staging.decisions[p.key];const hitK=new Set(p.ev.map(e=>e.k));
 const side=s=>sideBox(s,hitK);
 const col=p.route==='suggested'?'#16a34a':p.route==='review'?'#d97706':'#e5484d';
 return`<div class="card"><h3><span>${p.key.replace('+',' + ')}</span>${p.route==='suggested'?'<span class="badge b-ok">Suggested merge</span>':p.route==='review'?'<span class="badge b-warn">Review: one strong match</span>':'<span class="badge b-bad">Name-only look-alike — never auto-merge</span>'}<span class="sp"></span><span class="scorebar"><i style="width:${Math.min(100,p.score/145*100)}%;background:${col}"></i></span> <b>${p.score}</b> pts</h3>
 <div class="cb" style="padding:10px 16px">${p.ev.map(e=>`<span class="badge ${e.strong?'b-ok':'b-none'}">${esc(e.l)} +${e.p}</span>`).join(' ')} <span class="muted" style="margin-left:6px">${p.strong} strong signal${p.strong===1?'':'s'}</span></div>
 <div class="pair">${side(p.a)}${side(p.b)}</div>
 <div class="cb" style="border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap">${d?`<span class="badge b-warn">Deferred by ${esc(USERS[d.by]?.name)}: ${esc(d.reason)}</span><div class="sp"></div>`:'<div class="sp"></div>'}
 ${p.route!=='nameonly'?`<button class="btn ok" data-a="approve" data-v="${p.key}" ${canReview()?'':'disabled'}>${I('merge')} Approve & merge…</button>`:''}<button class="btn" data-a="decide" data-s="${p.route==='nameonly'?'Kept separate':'Rejected'}" data-v="${p.key}" ${canReview()?'':'disabled'}>${p.route==='nameonly'?'Keep separate':'Reject'}</button><button class="btn" data-a="decide" data-s="Deferred" data-v="${p.key}" ${canReview()?'':'disabled'}>Defer</button></div></div>`}
function openMerge(key){const p=computePairs(SOURCE).find(x=>x.key===key);const md=mergeDefaults(p.a,p.b);S.merge={key,md,a:p.a,b:p.b};mergeModal(p.a,p.b,md,p.ev,p.score)}
function mergeModal(a,b,md,ev,score){modal(`Merge ${esc(a.id)} + ${esc(b.id)}: choose the master value for each field`,`<div class="alert i" style="margin-bottom:12px">Pre-selected by the merge rules: verified source wins for identity fields, most recent wins for changing facts, a blank never replaces data, and a likely typo is kept as an alternate value. Click a cell to override.</div>
 <div class="tw"><table class="t compact mt"><tr><th>Field</th><th>${esc(a.id)} · ${esc(a.sys)}<br><span class="muted">${esc(a.updated)}</span></th><th>${esc(b.id)} · ${esc(b.sys)}<br><span class="muted">${esc(b.updated)}</span></th><th>Rule</th></tr>${md.map((f,i)=>`<tr><td class="muted">${esc(f.l)}</td><td class="pick ${f.pick==='a'?'on':''}" data-a="pick" data-i2="${i}" data-v="a">${esc(f.va)||'<span class="muted">(blank)</span>'}</td><td class="pick ${f.pick==='b'?'on':''}" data-a="pick" data-i2="${i}" data-v="b">${esc(f.vb)||'<span class="muted">(blank)</span>'}</td><td><span class="chip" id="why${i}">${esc(f.why)}</span>${f.alt?`<div class="muted" style="font-size:11px">alternate kept: ${esc(f.alt)}</div>`:''}</td></tr>`).join('')}</table></div>
 <div style="margin-top:12px"><label class="muted">Reason (required, saved to the Match & Merge Log)</label><textarea id="mreason">Same ${ev.filter(e=>e.strong).map(e=>e.l.toLowerCase()).join(', ')}. Score ${score}.</textarea></div>`,
 `<button class="btn" data-a="close">Cancel</button><button class="btn ok" data-a="domerge">${I('merge')} Merge and log</button>`,'wide')}
function survivorFor(p){return DB.contacts.find(c=>(c.sources||'').includes(p.a.id)||(c.sources||'').includes(p.b.id))||DB.contacts.find(c=>p.a.ensignId&&c.ensignId===p.a.ensignId)}
function recordDecision(key,status,reason,md){const p=computePairs(SOURCE).find(x=>x.key===key);const cp=survivorFor(p);const lid=nextId('log');
 DB.log.push({id:lid,batch:DB.staging.batch,action:status,survivor:cp?cp.id:'',sources:`${p.a.id}, ${p.b.id}`,score:p.score,evidence:p.ev.map(e=>`${e.l} (+${e.p})`).join('; '),reviewer:me(),at:nowISO(),reason,snapshot:{a:p.a,b:p.b,fields:md||mergeDefaults(p.a,p.b)}});
 DB.staging.decisions[key]={status,reason,by:me(),at:nowISO(),log:lid};
 if(cp)tl('contacts',cp.id,`${status}: ${p.a.id} + ${p.b.id} (score ${p.score}) — ${reason} [${lid}]`);
 if(status==='Merged'&&cp&&md){md.forEach(f=>{if(f.alt&&!(cp.variants||'').includes(f.alt))cp.variants=[cp.variants,`${f.l} ${f.alt} (alternate)`].filter(Boolean).join('; ')})}
 save();return lid}

function parseCSV(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}if(f!==''||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>String(x).trim()!==''))}

function saveForm(m,id,again,quick){const M=MOD[m];const root=$('#frm');const vals={};M.fields.filter(f=>f.t!=='formula'&&f.p!=='F').forEach(f=>{if(canEdit(f)){const v=readInput(root,f);if(v!==undefined)vals[f.k]=v}});

 if(m==='contacts'){const cand={...vals,first:vals.first||'',last:vals.last||'',pref:vals.pref||'',former:vals.former||''};const hits=DB.contacts.filter(c=>c.id!==id).map(c=>({c,s:scorePair(cand,c)})).filter(x=>x.s.strong>=1).sort((a,b)=>b.s.score-a.s.score);
  if(hits.length){const h=hits[0];$('#ferr').scrollIntoView({block:'start'});$('#ferr').innerHTML=`<div class="alert e" style="margin-bottom:12px"><b>Duplicate check:</b> this matches <a href="#/contacts/${h.c.id}">${esc(recName('contacts',h.c))}</a> on ${h.s.ev.filter(e=>e.strong).map(e=>esc(e.l)).join(', ')} (score ${h.s.score}). To keep one record per person, new information for an existing person goes through <a href="#/import">Import & Review</a> instead of creating a duplicate.</div>`;return}}
 if(id){Object.entries(vals).forEach(([k,v])=>{if(JSON.stringify(byId(m,id)[k])!==JSON.stringify(v))setField(m,id,k,v)});closeModal();toast(`${M.single} updated`);render();return}
 const rec={id:nextId(m),...Object.fromEntries(M.fields.map(f=>[f.k,f.t==='multi'?[]:f.t==='checkbox'?false:''])),...vals};
 if(m==='contacts'){rec.sources='Manual entry';rec.updated=todayISO();rec.dq=[];rec.variants='';rec.rationale='Created manually'}
 if(m==='edu'&&!rec.title)rec.title=`${rec.credential||'Credential'} – ${rec.program||rec.inst}`;
 DB[m].push(rec);tl(m,rec.id,`${M.single} created.`);
 if(m==='edu'&&rec.contact)tl('contacts',rec.contact,`Education History added: ${rec.inst} (${rec.status||'—'}).`);
 save();closeModal();toast(m==='contacts'?'Contact created. To mark this person as an alumnus, add an Education History record (Ensign College, Status = Completed).':`${M.single} created`);if(again){openForm(m,null,{},false,quick);return}location.hash=`#/${m}/${rec.id}`;render()}
function openTask(m,id){modal('Create Task',`<form class="form" id="tfrm"><div class="fgrid"><div class="ff full"><label>Subject <span class="req">*</span></label><input name="subject"></div><div class="ff"><label>Due Date</label><input type="date" name="due" value="${todayISO()}"></div><div class="ff"><label>Priority</label><select name="priority"><option>High</option><option selected>Normal</option><option>Low</option></select></div><div class="ff"><label>Owner</label>${inputFor({k:'owner',t:'user'},me())}</div><div class="ff"><label>Related To</label><select name="rel"><option value="">-None-</option>${['contacts','accounts'].map(mm=>DB[mm].map(r=>`<option value="${mm}|${r.id}" ${mm===m&&r.id===id?'selected':''}>${MOD[mm].single}: ${esc(recName(mm,r))}</option>`).join('')).join('')}</select></div></div></form>`,`<button class="btn" data-a="close">Cancel</button><button class="btn pr" data-a="savetask">Save</button>`)}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener('click',e=>{
 $$('details.dd[open]').forEach(d=>{if(!d.contains(e.target))d.removeAttribute('open')});
 if(!e.target.closest('.search'))$('#sres')&&($('#sres').innerHTML='');
 const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const a=el.dataset.a,m=el.dataset.m,id=el.dataset.id,v=el.dataset.v;
 if(el.tagName==='A'&&!['email'].includes(a))e.preventDefault();
 const dd=el.closest('details.dd');if(dd&&!['pick'].includes(a))dd.removeAttribute('open');
 switch(a){
 case'close':closeModal();break;
 case'side':$('#side').classList.toggle('open');break;
 case'theme':S.theme=S.theme==='dark'?'light':'dark';saveUI();render();break;
 case'go':if(el.dataset.h&&!el.dataset.h.endsWith('/')){location.hash=el.dataset.h}break;
 case'view':LS(m).view=v;LS(m).cols=null;LS(m).sort=null;LS(m).page=1;LS(m).sel=[];render();break;
 case'mode':LS(m).mode=v;render();break;
 case'sort':{const st=LS(m);const k=el.dataset.k;st.sort=st.sort&&st.sort.k===k?{k,d:-st.sort.d}:{k,d:1};render();break}
 case'pg':LS(m).page+=Number(v);render();break;
 case'unsel':LS(m).sel=[];render();break;
 case'clearf':LS(m).filters={};LS(m).sysf={};render();break;
 case'dtab':S.dtab=v;render();break;
 case'jump':{if(S.dtab!=='overview'){S.dtab='overview';render()}document.getElementById(v)?.scrollIntoView({behavior:'smooth',block:'start'});break}
 case'new':{const pre={};(el.dataset.pre||'').split('&').filter(Boolean).forEach(p=>{const[k,val]=p.split('=');pre[k]=val});openForm(m,null,pre);break}
 case'edit':openForm(m,id);break;
 case'clone':openForm(m,id,{},true);break;
 case'savef':saveForm(m,el.dataset.id||null,!!el.dataset.again,!!el.dataset.q);break;
 case'quick':openForm(m,null,{},false,true);break;
 case'newtask':openTask(m,id);break;
 case'savetask':{const f=$('#tfrm');const s=f.subject.value.trim();if(!s){toast('Subject is required');return}const[rm,rid]=(f.rel.value||'|').split('|');DB.tasks.push({id:nextId('tasks'),subject:s,due:f.due.value,priority:f.priority.value,status:'Open',owner:f.owner.value,mod:rm,rid});if(rid)tl(rm,rid,`Task created: ${s}`);save();closeModal();toast('Task created');render();break}
 case'donetask':{const t=DB.tasks.find(x=>x.id===id);t.status='Completed';if(t.rid)tl(t.mod,t.rid,`Task completed: ${t.subject}`);save();toast('Task completed');S._keep=true;render();break}
 case'addnote':{const t=$('#newnote').value.trim();if(!t)return;DB.notes.push({id:nextId('notes'),mod:m,rid:id,text:t,by:me(),at:nowISO()});tl(m,id,'Note added.');save();S._keep=true;render();break}
 case'email':e.preventDefault();toast(`Compose email to ${v} (mock — no email is sent)`);break;
 case'print':window.print();break;
 case'del':if(role()!=='admin'){toast('Restricted: Contacts are merged or removed only through the Import & Review process.');return}if(confirm('Delete this record? (Sandbox)')){DB[m]=DB[m].filter(r=>r.id!==id);save();location.hash='#/'+m}break;
 case'massdel':toast(role()==='admin'?'Mass delete is disabled in this sandbox. Use Import & Review to merge duplicates.':'Restricted: only Administrators can delete, and merges go through review.');break;
 case'findmerge':location.hash='#/import';break;
 case'iedit':{if(el.querySelector('.edbox'))return;const f=MOD[m].fmap[el.dataset.k];const r=byId(m,id);el.classList.remove('ed');el.innerHTML=`<div class="edbox">${inputFor(f,r[f.k],m)}<div class="row"><button class="btn sm pr" data-a="isave" data-m="${m}" data-id="${id}" data-k="${f.k}">Save</button><button class="btn sm" data-a="icancel">Cancel</button></div></div>`;el.querySelector('input,select,textarea')?.focus();break}
 case'isave':{const f=MOD[m].fmap[el.dataset.k];const box=el.closest('.edbox');const val=readInput(box,f);if(setField(m,id,f.k,val)){toast(`${f.l} updated`);S._keep=true;render()}break}
 case'icancel':S._keep=true;render();break;
 case'champ':{setField('accounts',id,'champion',v);toast('Alumni Champion updated');S._keep=true;render();break}
 case'mass':openMass(m);break;
 case'domass':{const k=$('#mfield').value;const f=MOD[m].fmap[k];const val=readInput($('#mval'),f);const st=LS(m);const ids=st.sel.length?st.sel:listRows(m).map(r=>r.id);ids.forEach(i=>setField(m,i,k,val));closeModal();toast(`Updated ${f.l} on ${ids.length} record(s)`);render();break}
 case'cols':openCols(m);break;
 case'savecols':{LS(m).cols=$$('#colsfrm input:checked').map(i=>i.value);closeModal();render();break}
 case'export':exportCSV(m);break;
 case'exportrep':toast('Report exported (mock).');break;
 case'exportjson':{const b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});dl(b,'crm-sandbox-data.json');break}
 case'resetall':if(confirm('Reset all demo data to the original case-study records?')){DB=seed();save();S.ls={};toast('Demo data reset');render()}break;
 case'runimport':DB.staging.ran=true;DB.staging.decisions={};save();S.importTab='suggested';toast('26 rows staged · standardized · scored · routed: 8 suggested merges, 1 name-only match');render();break;
 case'resetimport':DB.staging.ran=false;DB.staging.decisions={};save();render();break;
 case'itab':S.importTab=v;render();break;
 case'approve':openMerge(v);break;
 case'pick':{const i=Number(el.dataset.i2);S.merge.md[i].pick=v;S.merge.md[i].why='Manual override by reviewer';el.parentElement.querySelectorAll('.pick').forEach(c=>c.classList.toggle('on',c===el));$('#why'+i).textContent='Manual override by reviewer';break}
 case'domerge':{const reason=$('#mreason').value.trim();if(!reason){toast('A reason is required');return}if(S.merge.kind==='batch'){applyBatchMerge(reason);closeModal();toast('Merged into the live contact and logged');S._keep=true;render();break}const lid=recordDecision(S.merge.key,'Merged',reason,S.merge.md);closeModal();toast(`Merged and logged as ${lid}`);S._keep=true;render();break}
 case'decide':{const st=el.dataset.s;modal(`${st} — ${v.replace('+',' + ')}`,`<label class="muted">Reason (required, saved to the Match & Merge Log)</label><textarea id="dreason">${st==='Kept separate'?'Name-only match; phone, emails, school and employer differ.':''}</textarea>`,`<button class="btn" data-a="close">Cancel</button><button class="btn pr" data-a="dodecide" data-s="${st}" data-v="${v}">Confirm</button>`);break}
 case'dodecide':{const r=$('#dreason').value.trim();if(!r){toast('A reason is required');return}const lid=recordDecision(v,el.dataset.s,r);closeModal();toast(`${el.dataset.s} · logged as ${lid}`);S._keep=true;render();break}
 case'imptab':S.imp=v;if(!location.hash.startsWith('#/import'))location.hash='#/import';else render();break;
 case'importm':S.wiz=wizDefault(m||'contacts');S.imp='wizard';if(!location.hash.startsWith('#/import'))location.hash='#/import';else render();break;
 case'sample':loadSample(v);break;
 case'tmpl':{const F2=IMPF[S.wiz.m];dl(new Blob([F2.map(f=>f[1]).join(',')+'\n'],{type:'text/csv'}),`${S.wiz.m}-import-template.csv`);break}
 case'wstep':{const n=Number(v);if(n===3&&!S.wiz.name)S.wiz.name=`${S.wiz.fileName} – ${todayISO()}`;if(n===4)S.wiz.plan=planRows(S.wiz);S.wiz.step=n;render();$('.main').scrollTop=0;break}
 case'wreset':S.wiz=wizDefault(S.wiz.m);render();break;
 case'wrun':runWizard();break;
 case'rbt':S.rbt=v;render();break;
 case'openbatch':S.rb=v;S.imp='review';render();break;
 case'approveb':{const b=batchById(el.dataset.b),r=b.rows[Number(el.dataset.r)];const tr=r.target.kind==='row'?b.rows[r.target.id]:null;const cid=r.target.kind==='contact'?r.target.id:(tr&&tr.createdId)||'';const a=cid?contactShape(byId('contacts',cid)):tr.data;const md=mergeDefaults(a,r.data);S.merge={kind:'batch',bid:b.id,ri:r.i,cid,md,a,b:r.data};mergeModal(a,r.data,md,r.ev,r.score);break}
 case'decideb':{const st=el.dataset.s;modal(`${st}: row ${esc(batchById(el.dataset.b).rows[Number(el.dataset.r)].data.id)}`,`<label class="muted">Reason (required, saved to the Match & Merge Log)</label><textarea id="dreason">${st==='Not a match'?'Different person: only weak or coincidental evidence matches.':''}</textarea>`,`<button class="btn" data-a="close">Cancel</button><button class="btn pr" data-a="dodecideb" data-s="${st}" data-b="${el.dataset.b}" data-r="${el.dataset.r}">Confirm</button>`);break}
 case'dodecideb':{const b=batchById(el.dataset.b),r=b.rows[Number(el.dataset.r)],st=el.dataset.s,reason=$('#dreason').value.trim();if(!reason){toast('A reason is required');return}const cid=r.target&&r.target.kind==='contact'?r.target.id:'';if(st==='Not a match'){logB(b,r,'Kept separate',reason,cid);r.route='new';r.target=null;r.score=0;r.ev=[];r.status='pending'}else if(st==='Skipped'){r.status='Skipped';logB(b,r,'Skipped',reason,cid)}else{r.status='Deferred';logB(b,r,'Deferred',reason,cid)}save();closeModal();toast(`${st}: logged`);S._keep=true;render();break}
 case'createb':{const b=batchById(el.dataset.b);const c=createFromRow(b,b.rows[Number(el.dataset.r)]);save();toast(`Created ${recName('contacts',c)}`);S._keep=true;render();break}
 case'createall':{const b=batchById(el.dataset.b);const rs=b.rows.filter(r=>['pending','Deferred'].includes(r.status)&&r.route==='new');rs.forEach(r=>createFromRow(b,r));save();toast(`Created ${rs.length} contacts`);render();break}
 case'undo':{const b=batchById(v);if(!confirm(`Undo import ${b.id}? Records it created are removed and merged contacts are restored from their snapshots.`))return;undoBatch(b);toast(`Import ${b.id} undone`);render();break}
 case'newview':openCV(m);break;
 case'editview':openCV(m,v);break;
 case'cvadd':readCV();S.cv.crit.push({k:'',op:'is',v:''});$('#cvform').innerHTML=cvBody();cvRefresh();break;
 case'cvdel':readCV();S.cv.crit.splice(Number(v),1);if(!S.cv.crit.length)S.cv.crit.push({k:'',op:'is',v:''});$('#cvform').innerHTML=cvBody();cvRefresh();break;
 case'savecv':saveCV();break;
 case'deletecv':{if(!confirm('Delete this custom view?'))return;DB.customViews=DB.customViews.filter(c=>c.id!==S.cv.id);LS(S.cv.m).view='all';save();closeModal();toast('View deleted');render();break}
 case'fav':{const k=m+':'+v;const a=DB.favs[me()]=DB.favs[me()]||[];const i=a.indexOf(k);if(i>=0)a.splice(i,1);else a.push(k);save();render();break}
 case'reverse':{const l=byId('log',id);if(!confirm(`Reverse merge ${l.sources}? The before-merge snapshot will be restored to staging.`))return;l.action='Reversed';const key=l.sources.replace(', ','+');if(DB.staging.decisions[key])delete DB.staging.decisions[key];DB.log.push({id:nextId('log'),batch:l.batch,action:'Reversed',survivor:l.survivor,sources:l.sources,score:l.score,evidence:l.evidence,reviewer:me(),at:nowISO(),reason:`Reversal of ${l.id}. Source rows restored from snapshot.`,snapshot:l.snapshot});tl('contacts',l.survivor,`Merge ${l.id} reversed; ${l.sources} returned to the review queue.`);save();toast('Merge reversed — rows back in the review queue');render();break}
 }});
document.addEventListener('change',e=>{if(e.target.id==='wfile'&&e.target.files[0]){loadFile(e.target.files[0]);return}if(e.target.closest('#cvform')){cvRefresh();return}const el=e.target.closest('[data-i]');if(!el)return;const i=el.dataset.i,m=el.dataset.m;
 if(i==='role'){S.role=el.value;S.layoutOverride=null;saveUI();toast(`Now viewing as ${ROLES[S.role].label} (${USERS[me()].name})`);render()}
 if(i==='layout'){S.layoutOverride=el.value;render()}
 if(i==='fon'){const st=LS(m);st.filters[el.dataset.k]={on:el.checked,val:''};render()}
 if(i==='fval'&&el.tagName==='SELECT'){LS(m).filters[el.dataset.k].val=el.value;LS(m).page=1;render()}
 if(i==='per'){LS(m).per=Number(el.value);LS(m).page=1;render()}
 if(i==='sel'){const st=LS(m);const id=el.dataset.id;st.sel=el.checked?[...st.sel,id]:st.sel.filter(x=>x!==id);render()}
 if(i==='selall'){const st=LS(m);const ids=listRows(m).slice((st.page-1)*st.per,st.page*st.per).map(r=>r.id);st.sel=el.checked?[...new Set([...st.sel,...ids])]:st.sel.filter(x=>!ids.includes(x));render()}
 if(i==='sysf'){const st=LS(m);st.sysf=st.sysf||{};st.sysf[el.dataset.k]=el.checked;st.page=1;render()}
 if(i==='wmod'){S.wiz=wizDefault(el.value);render()}
 if(i==='wmap'){S.wiz.map[Number(el.dataset.idx)]=el.value;render()}
 if(i==='wsheet'){S.wiz.sheet=el.value;readSheet()}
 if(i==='wdup')S.wiz.dup=el.value;if(i==='wnew')S.wiz.nw=el.value;if(i==='adup')S.wiz.adup=el.value;
 if(i==='rb'){S.rb=el.value;render()}
 if(el.id==='mfield')mfieldChange(m)});
let qT;document.addEventListener('input',e=>{const el=e.target;
 if(el.closest('#cvform')){if(el.tagName!=='SELECT'){readCV();cvCount()}return}if(el.dataset.i==='vsearch'){$$('.vitem').forEach(x=>x.style.display=lc(x.textContent).includes(lc(el.value))?'':'none');return}if(el.dataset.i==='wname'){S.wiz.name=el.value;return}if(el.dataset.i==='wsys'){S.wiz.sys=el.value;return}
 if(el.id==='gsearch'){S.q=el.value;clearTimeout(qT);qT=setTimeout(gsearch,120)}
 if(el.dataset.i==='lq'||(el.dataset.i==='fval'&&el.tagName==='INPUT')){const m=el.dataset.m;if(el.dataset.i==='lq')LS(m).q=el.value;else LS(m).filters[el.dataset.k].val=el.value;LS(m).page=1;const pos=el.selectionStart,key=el.dataset.i+(el.dataset.k||'');clearTimeout(qT);qT=setTimeout(()=>{render();const n=[...$$('[data-i]')].find(x=>x.dataset.i+(x.dataset.k||'')===key&&x.tagName==='INPUT');if(n){n.focus();n.setSelectionRange(pos,pos)}},200)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();$('#gsearch').focus()}if(e.key==='Enter'&&e.target.id==='newnote')$('[data-a="addnote"]').click()});
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('.drop');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('.drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('.drop');if(d){e.preventDefault();const f=e.dataTransfer.files[0];if(f)loadFile(f)}});
function gsearch(){const q=lc(S.q),box=$('#sres');if(!box)return;if(q.length<2){box.innerHTML='';return}const qd=q.replace(/\D/g,'');let html='';
 ['contacts','accounts','edu','emp','intern','visits','projects','log'].forEach(m=>{const hits=DB[m].filter(r=>lc(recName(m,r)).includes(q)||MOD[m].fields.some(f=>{const p=lc(plain(m,f.k,r));return p.includes(q)||(qd.length>=4&&f.t==='phone'&&p.replace(/\D/g,'').includes(qd))})).slice(0,6);
  if(hits.length)html+=`<div class="grp">${MOD[m].label}</div>`+hits.map(r=>`<a href="#/${m}/${r.id}">${esc(recName(m,r))} <span class="muted">${m==='contacts'?esc([r.pemail,r.ensignId].filter(Boolean).join(' · ')):''}</span></a>`).join('')});
 box.innerHTML=html?`<div class="sres">${html}</div>`:`<div class="sres"><div class="empty" style="padding:16px">No results for “${esc(S.q)}”</div></div>`}
function openMass(m){const fs=MOD[m].fields.filter(f=>canEdit(f)&&!['textarea'].includes(f.t));const st=LS(m);const n=st.sel.length||listRows(m).length;
 if(MOD[m].readonly||!fs.length){toast('No fields you can mass update in this module with your role.');return}
 modal(`Mass Update ${MOD[m].label}`,`<div class="alert i" style="margin-bottom:12px">Applies to <b>${n}</b> ${st.sel.length?'selected':'records in the current view'}. Only fields your role (${ROLES[S.role].label}) can edit are listed.</div><div class="fgrid"><div class="ff full"><label>Field</label><select id="mfield" data-m="${m}">${fs.map(f=>`<option value="${f.k}">${esc(f.l)}</option>`).join('')}</select></div><div class="ff full"><label>New value</label><div id="mval">${inputFor(fs[0],'')}</div></div></div>`,`<button class="btn" data-a="close">Cancel</button><button class="btn pr" data-a="domass" data-m="${m}">Update</button>`)}
function mfieldChange(m){const f=MOD[m].fmap[$('#mfield').value];$('#mval').innerHTML=inputFor(f,'')}
function openCols(m){const M=MOD[m];const cur=LS(m).cols||M.cols;const all=['name',...M.fields.map(f=>f.k).filter(k=>k!=='name')];modal('Manage Columns',`<div id="colsfrm" class="multi" style="flex-direction:column;gap:6px">${all.map(k=>`<label><input type="checkbox" value="${k}" ${cur.includes(k)?'checked':''}> ${esc(k==='name'?M.single+' Name':M.fmap[k].l)}</label>`).join('')}</div>`,`<button class="btn" data-a="close">Cancel</button><button class="btn pr" data-a="savecols" data-m="${m}">Save</button>`)}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}
function exportCSV(m){const M=MOD[m];const rows=listRows(m);const ks=['name',...M.fields.map(f=>f.k).filter(k=>k!=='name')];const q=s=>`"${String(s??'').replace(/"/g,'""')}"`;const csv=[ks.map(k=>q(k==='name'?'Name':M.fmap[k].l)).join(','),...rows.map(r=>ks.map(k=>q(plain(m,k,r))).join(','))].join('\n');dl(new Blob([csv],{type:'text/csv'}),`${m}.csv`);toast(`Exported ${rows.length} rows`)}

window.addEventListener('hashchange',()=>{S.dtab='overview';render();$('.main')&&($('.main').scrollTop=0)});
window.addEventListener('resize',()=>{if(S.route.page==='setup')drawLinks()});
render();
</script>
